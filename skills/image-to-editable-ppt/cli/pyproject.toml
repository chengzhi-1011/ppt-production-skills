[project]
name = "image-to-editable-ppt-cli"
version = "0.2.0"
description = "Self-contained editppt CLI for the image-to-editable-ppt skill."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "pypdfium2>=4.30.0,<5",
  "Pillow>=10.0.0,<13",
  "openai>=2.0.0,<3",
  "PyYAML>=6.0.0,<7",
  "numpy>=1.26.0,<3",
  "requests>=2.31.0,<3",
]

[project.scripts]
editppt = "editppt.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["editppt"]

[tool.hatch.build]
exclude = [
  "**/.DS_Store",
  "**/__pycache__",
]
