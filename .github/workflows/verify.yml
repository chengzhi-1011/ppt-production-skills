name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-verification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2
      - name: Verify repository
        shell: pwsh
        run: .\scripts\verify.ps1
      - name: Build CLI distributions
        shell: pwsh
        run: uv build --project .\skills\image-to-editable-ppt\cli
